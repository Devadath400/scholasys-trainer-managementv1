<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholasys Trainer Management Portal</title>
<style>
:root{--navy:#081a35;--blue:#1167d8;--cyan:#18b8d6;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6c778a;--line:#e3e8f0;--green:#15966c;--red:#d84b55;--amber:#d58a13;--shadow:0 14px 40px rgba(12,34,67,.09)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#153a6c,#06142a 65%);display:grid;place-items:center;z-index:99;color:#fff}.splash-inner{text-align:center;animation:rise .9s ease}.splash img{width:150px;filter:drop-shadow(0 14px 30px #0007);animation:logo 1.3s ease}.splash h1{margin:22px 0 6px;font-size:25px}.splash p{margin:0;color:#a9d9e8;letter-spacing:.18em;text-transform:uppercase;font-size:12px}.splash .enter{margin-top:34px;opacity:0;animation:appear .7s 1.8s forwards;background:linear-gradient(90deg,var(--blue),var(--cyan));border:0;color:#fff;padding:13px 26px;border-radius:11px;font-weight:700}.app{display:none;min-height:100vh}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;object-fit:contain}.brand strong{font-size:16px}.brand small{display:block;color:var(--muted);margin-top:2px}.login{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:30px}.login-card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:var(--shadow)}.login-card h2{margin:0 0 8px}.login-card p{color:var(--muted)}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e0ea;border-radius:10px;padding:11px;background:#fff;outline:none}.field textarea{min-height:110px;resize:vertical}.primary,.secondary,.danger{border:0;border-radius:10px;padding:11px 16px;font-weight:700}.primary{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#fff}.secondary{background:#edf3fa;color:#16345c}.danger{background:#fff0f1;color:#b42d38}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:10px;font-weight:700;color:#526079}.tab.active{background:#0c2c55;color:#fff;border-color:#0c2c55}.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 76px)}.side{background:var(--navy);padding:22px 14px;color:#d9e6f7}.side .role{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#7da2cb;margin:0 12px 15px}.nav{width:100%;border:0;background:transparent;color:#cfe0f4;text-align:left;padding:12px;border-radius:9px;margin:3px 0;font-weight:650}.nav:hover,.nav.active{background:#12335e;color:#fff}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.title{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.title h1{margin:0 0 6px}.title p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(20,45,80,.04)}.metric{font-size:28px;font-weight:800;margin-top:8px}.label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.section{margin-top:22px}.section h3{margin:0 0 13px}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{background:#f8fafc;color:#5a667b}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.present,.approved{background:#e6f7f0;color:#087654}.absent,.declined,.rejected{background:#fff0f1;color:#b52e39}.pending{background:#fff7e4;color:#a66a06}.info{background:#e9f3ff;color:#1464bb}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{background:#fff;border:1px solid var(--line);min-height:78px;border-radius:10px;padding:8px}.day .n{font-weight:800}.day.present-day{border-color:#8bd7bd;background:#f0fbf7}.day.absent-day{border-color:#efb4b9;background:#fff6f6}.day small{display:block;margin-top:9px;font-weight:800;font-size:10px}.calendar-head{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:7px;color:var(--muted);font-size:11px;font-weight:800;text-align:center}.upload{border:1px dashed #9eb2c9;border-radius:12px;padding:18px;background:#f8fbff}.camera{display:grid;grid-template-columns:1fr 1fr;gap:16px}.camera video,.camera img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:#07172c}.photo{max-width:160px;border-radius:10px}.school-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.school{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:750}.muted{color:var(--muted)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#06142aaa;display:grid;place-items:center;z-index:50;padding:20px}.modalbox{background:#fff;border-radius:18px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:24px}.right{margin-left:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:13px 15px;border-left:4px solid var(--blue);background:#f3f8ff;border-radius:8px;margin:9px 0}.footer-note{font-size:11px;color:var(--muted);margin-top:16px}@keyframes logo{0%{opacity:0;transform:scale(.5) rotate(-8deg)}60%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}@keyframes appear{to{opacity:1}}@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}@media(max-width:950px){.shell{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:5px}.side .role{display:none}.nav{white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}.school-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top{padding:0 14px}.brand strong{font-size:13px}.main{padding:16px}.grid{grid-template-columns:1fr 1fr}.camera{grid-template-columns:1fr}.calendar .day{min-height:60px}.day small{font-size:9px}}
</style>
<style>
:root{
 --navy:#071a33;--navy2:#0b2850;--blue:#0877d9;--cyan:#12b8d4;--ink:#14243a;
 --muted:#708096;--line:#e6ebf2;--bg:#f5f8fc;--white:#fff;--success:#138a67;--danger:#c23d4a;
 --shadow:0 18px 55px rgba(9,31,59,.08);--shadow2:0 8px 28px rgba(9,31,59,.07)
}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f7faff 0,#f3f6fa 100%);color:var(--ink);letter-spacing:.01em}
button,input,select,textarea{font-family:inherit}
.splash{background:radial-gradient(900px 520px at 50% 25%,#153e73 0,#0a2142 42%,#041021 100%);overflow:hidden}
.splash:before,.splash:after{content:"";position:absolute;border:1px solid rgba(87,205,232,.18);border-radius:50%;width:560px;height:560px;left:50%;top:50%;transform:translate(-50%,-50%);animation:orbit 8s linear infinite}
.splash:after{width:760px;height:760px;animation-duration:13s;animation-direction:reverse}
.splash-inner{position:relative;z-index:2;max-width:720px;padding:40px 25px}
.splash img{width:180px;height:180px;object-fit:contain;filter:drop-shadow(0 20px 45px rgba(0,0,0,.35));animation:logo 1.2s cubic-bezier(.2,.8,.2,1)}
.splash h1{font-size:clamp(23px,3vw,34px);font-weight:750;letter-spacing:-.02em;margin:22px 0 8px}
.splash p{font-size:12px;letter-spacing:.28em;color:#8ddff0}
.splash .enter{position:relative;z-index:3;margin-top:38px;padding:14px 28px;border-radius:12px;background:linear-gradient(110deg,#0877d9,#12b8d4);box-shadow:0 10px 35px rgba(18,184,212,.25);transition:.2s transform,.2s box-shadow}
.splash .enter:hover{transform:translateY(-2px);box-shadow:0 15px 42px rgba(18,184,212,.35)}
.top{height:82px;padding:0 34px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);box-shadow:0 1px 0 rgba(20,40,70,.04)}
.brand{gap:13px}.brand img{width:54px;height:54px}.brand strong{font-size:15px;letter-spacing:.01em}.brand small{font-size:11px;letter-spacing:.04em}
.login{min-height:calc(100vh - 82px);background:radial-gradient(circle at 50% 0,#eaf6ff 0,transparent 36%);position:relative}
.login-card{border-radius:24px;padding:38px;box-shadow:var(--shadow);border-color:#e1e8f1;position:relative;overflow:hidden}
.login-card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.login-card h2{font-size:27px;letter-spacing:-.03em}.login-card p{font-size:13px}
.tabs{background:#f2f6fa;padding:5px;border-radius:13px}.tab{flex:1;border:0;background:transparent;border-radius:9px;padding:10px}.tab.active{background:#0b2850;box-shadow:0 4px 12px rgba(7,26,51,.16)}
.field label{color:#34465d;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.field input,.field select,.field textarea{border-color:#dfe6ee;padding:12px 13px;border-radius:11px;transition:.18s box-shadow,.18s border-color}.field input:focus,.field select:focus,.field textarea:focus{border-color:#62b7e9;box-shadow:0 0 0 4px rgba(8,119,217,.08)}
.primary{background:linear-gradient(100deg,#0877d9,#12b8d4);box-shadow:0 8px 22px rgba(8,119,217,.16)}
.secondary{background:#eef4fa;border:1px solid #dce6f0}.danger{border:1px solid #f0cdd1}
.shell{grid-template-columns:252px 1fr;background:#f5f8fc}
.side{background:linear-gradient(180deg,#071a33,#0a2344);padding:24px 14px;border-right:1px solid rgba(255,255,255,.06);position:sticky;top:82px;height:calc(100vh - 82px);overflow:auto}
.side:after{content:"SCHOLASYS\A TRAINER MANAGEMENT";white-space:pre;display:block;color:rgba(255,255,255,.26);font-size:9px;letter-spacing:.18em;line-height:1.8;padding:24px 12px 0}
.side .role{font-size:10px;color:#80cfe0;letter-spacing:.14em;margin:0 12px 14px}.nav{border:1px solid transparent;padding:11px 13px;color:#b9cce1;border-radius:10px;transition:.16s background,.16s color,.16s transform}.nav:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(2px)}.nav.active{background:linear-gradient(90deg,rgba(8,119,217,.9),rgba(18,184,212,.55));color:#fff;border-color:rgba(255,255,255,.08);box-shadow:0 8px 22px rgba(0,0,0,.12)}
.main{padding:34px 36px 50px;max-width:1600px}.title{margin-bottom:22px}.title h1{font-size:28px;letter-spacing:-.035em}.title p{font-size:13px;color:#748398}
.grid{gap:18px;margin:20px 0}.card{border-radius:17px;border-color:#e3e9f0;box-shadow:var(--shadow2);transition:transform .18s,box-shadow .18s}.card:hover{box-shadow:0 12px 35px rgba(9,31,59,.08)}
.metric{font-size:30px;letter-spacing:-.04em}.label{font-size:10px;letter-spacing:.12em;color:#7b8ba0}.badge{border:1px solid transparent;letter-spacing:.03em}.present{border-color:#bfe8da}.absent,.declined,.rejected{border-color:#f2c9ce}.pending{border-color:#f1dfb5}
.table{box-shadow:var(--shadow2);border-radius:15px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em}.table td{background:#fff}.table tr:last-child td{border-bottom:0}
.calendar-head{color:#7b899b;text-transform:uppercase;letter-spacing:.08em}.day{border-radius:12px;min-height:84px;transition:.15s transform,.15s box-shadow}.day:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(9,31,59,.07)}.day.present-day{background:linear-gradient(180deg,#f3fcf8,#eaf8f3);border-color:#b8e4d4}.day.absent-day{background:linear-gradient(180deg,#fff8f8,#fff2f3);border-color:#efd0d4}.day small{letter-spacing:.08em}
.school-grid{gap:14px}.school{border-radius:13px;box-shadow:0 4px 15px rgba(9,31,59,.04);transition:.15s transform,.15s border-color}.school:hover{transform:translateY(-2px);border-color:#9ecce8}
.notice{border-left:3px solid #159bd0;background:linear-gradient(90deg,#f3f9ff,#fff);box-shadow:0 3px 12px rgba(9,31,59,.03);padding:15px 16px}
.camera video,.camera img{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 10px 25px rgba(7,26,51,.16)}.upload{background:linear-gradient(145deg,#f8fbff,#f0f6fc);border-color:#b9cadb;min-height:150px;display:grid;place-items:center;text-align:center;color:#6c7d91}
.modal{backdrop-filter:blur(5px)}.modalbox{box-shadow:0 25px 70px rgba(3,20,40,.22);border:1px solid #e0e7ef}
.footer-note{line-height:1.6}
@keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media(max-width:950px){.side{position:static;height:auto;border-right:0;border-bottom:1px solid rgba(255,255,255,.06)}.side:after{display:none}.main{padding:24px}.top{padding:0 18px}}
@media(max-width:600px){.top{height:72px}.brand img{width:44px;height:44px}.brand small{display:none}.main{padding:18px}.login-card{padding:28px 22px}.splash img{width:145px;height:145px}.splash h1{font-size:22px}.grid{grid-template-columns:1fr 1fr}.shell{display:block}}
</style>
</head>
<body>
<div id="splash" class="splash"><div class="splash-inner"><img src="STS New logo(3).png"><h1>Scholasys Technologies and Solutions Pvt Ltd</h1><p>Trainer Management Portal</p><button class="enter" onclick="enterPortal()">ENTER PORTAL</button></div></div>
<div id="app" class="app"><header class="top"><div class="brand"><img src="STS New logo(3).png"><div><strong>Scholasys Trainer Management</strong><small>Operations &amp; Training Workspace</small></div></div><div id="topUser" class="muted" style="font-size:12px;font-weight:650"></div></header><div id="loginView" class="login"><div class="login-card"><h2>Secure Portal Access</h2><p>Choose your access area and sign in.</p><div class="tabs"><button class="tab active" onclick="setLogin('trainer',this)">Trainer</button><button class="tab" onclick="setLogin('master',this)">Master</button></div><div id="masterRoleWrap" class="field hidden"><label>Master Section</label><select id="masterRole"><option>Regional Head</option><option>Operational Manager</option><option>Management</option></select></div><div class="field"><label>User ID</label><input id="loginId" placeholder="Enter ID"></div><div class="field"><label>Password / Passcode</label><input id="loginPw" type="password" placeholder="Enter password"></div><button class="primary" style="width:100%" onclick="login()">Sign In</button><div class="footer-note">Demo credentials are included in README. Passwords are changeable in the profile/security area.</div><div id="loginMsg" class="footer-note"></div></div></div><div id="portal" class="hidden"></div></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<script>
const trainers=[
{id:'STS01',name:'Devadathan',schools:['Dy Patil'],city:'Mumbai',role:'Trainer / Regional Head'},
{id:'STS02',name:'Prashant',schools:['KCA'],city:'Delhi',role:'Trainer / Regional Head'},
{id:'STS03',name:'Komal',schools:['Guru'],city:'Mumbai',role:'Trainer'},
{id:'STS04',name:'Vibin',schools:['Model'],city:'Mumbai',role:'Trainer'},
{id:'STS05',name:'Malavika',schools:['Literacy India'],city:'Mumbai',role:'Trainer'},
{id:'STS06',name:'Vedika',schools:['Dy Patil'],city:'Mumbai',role:'Trainer'},
{id:'STS07',name:'Vinittha',schools:['KCA'],city:'Mumbai',role:'Trainer'},
{id:'STS08',name:'Chaitali',schools:['Guru'],city:'Mumbai',role:'Trainer'}];
const masters=[
{id:'STS0RD',name:'Devadathan',section:'Regional Head',city:'Mumbai',trainerId:'STS01'},
{id:'STS0RP',name:'Prashant',section:'Regional Head',city:'Delhi',trainerId:'STS02'},
{id:'STS0MP',name:'Preethi M',section:'Operational Manager / Management'},
{id:'STS0MK',name:'Kiran Kumar',section:'Operational Manager'},
{id:'STS0MJ',name:'Jojy',section:'Management'},
{id:'STS0MT',name:'Tony',section:'Management'},
{id:'STS0MJA',name:'Jazan',section:'Management'}];
const schools=['Dy Patil','KCA','Guru','Model','Literacy India'];
let mode='trainer', current=null, stream=null, attendanceCanvas=document.createElement('canvas');
let db=JSON.parse(localStorage.getItem('stsTrainerDB')||'null')||{attendance:[],assignments:[{id:1,title:'Prepare Grade 6 Robotics Activity',description:'Prepare components and lesson flow for the upcoming robotics session.',assignedTo:'STS01',due:'2026-10-02',priority:'High',status:'Pending',file:null}],notices:[{id:1,title:'Monthly planning',text:'Please keep your school activity records updated before the monthly review.',date:'2026-09-30'}],leaves:[],weekly:[],monthly:[],allocations:trainers.reduce((a,t)=>{a[t.id]=t.schools;return a},{})};
function save(){localStorage.setItem('stsTrainerDB',JSON.stringify(db))}
function enterPortal(){document.getElementById('splash').style.display='none';document.getElementById('app').style.display='block'}
function setLogin(x,b){mode=x;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');document.getElementById('masterRoleWrap').classList.toggle('hidden',x!=='master')}
function login(){let id=document.getElementById('loginId').value.trim().toUpperCase(),pw=document.getElementById('loginPw').value; if(mode==='trainer'){let t=trainers.find(x=>x.id===id);if(!t||pw!=='0211'){document.getElementById('loginMsg').textContent='Invalid trainer ID or password.';return;}current={...t,type:'trainer'};renderTrainer()}else{let m=masters.find(x=>x.id===id);if(!m||pw!=='9847'){document.getElementById('loginMsg').textContent='Invalid master ID or passcode.';return;}current={...m,type:'master',masterRole:document.getElementById('masterRole').value};renderMaster()} document.getElementById('loginView').classList.add('hidden');document.getElementById('topUser').textContent=current.name+' · '+current.id}
function nav(items,active){return `<aside class="side"><div class="role">${current.type==='trainer'?'Trainer Workspace':current.masterRole}</div>${items.map(x=>`<button class="nav ${active===x[0]?'active':''}" onclick="${x[1]}">${x[0]}</button>`).join('')}<button class="nav" onclick="logout()">Sign Out</button></aside>`}
function layout(title,sub,items,active,content){document.getElementById('portal').innerHTML=`<div class="shell">${nav(items,active)}<main class="main"><div class="title"><div><h1>${title}</h1><p>${sub}</p></div></div>${content}</main></div>`}
function renderTrainer(active='Overview'){document.getElementById('portal').classList.remove('hidden');let items=[['Overview',"renderTrainer('Overview')"],['Attendance',"renderTrainer('Attendance')"],['Assignments',"renderTrainer('Assignments')"],['Reports',"renderTrainer('Reports')"],['Leave Application',"renderTrainer('Leave')"],['Profile & Security',"renderTrainer('Profile')"]];let c='';if(active==='Overview')c=trainerOverview();if(active==='Attendance')c=trainerAttendance();if(active==='Assignments')c=trainerAssignments();if(active==='Reports')c=trainerReports();if(active==='Leave')c=trainerLeave();if(active==='Profile')c=profile();layout('Trainer Dashboard','Daily operations, attendance, assignments and reporting',items,active,c)}
function trainerOverview(){let today=new Date().toISOString().slice(0,10),a=db.attendance.find(x=>x.trainerId===current.id&&x.date===today),as=db.assignments.filter(x=>x.assignedTo===current.id);return `<div class="grid"><div class="card"><div class="label">Today</div><div class="metric">${a?'Present':'Not Marked'}</div><span class="badge ${a?'present':'pending'}">${a?'Attendance recorded':'Action required'}</span></div><div class="card"><div class="label">Schools</div><div class="metric">${(db.allocations[current.id]||[]).length}</div><div class="muted">Assigned schools</div></div><div class="card"><div class="label">Assignments</div><div class="metric">${as.filter(x=>x.status!=='Completed').length}</div><div class="muted">Open tasks</div></div><div class="card"><div class="label">Pending Leave</div><div class="metric">${db.leaves.filter(x=>x.trainerId===current.id&&x.status==='Pending').length}</div><div class="muted">Applications</div></div></div><div class="section card"><h3>Announcements</h3>${db.notices.length?db.notices.map(n=>`<div class="notice"><b>${n.title}</b><div>${n.text}</div><small class="muted">${n.date}</small></div>`).join(''):'<p class="muted">No announcements.</p>'}</div><div class="section card"><h3>Assigned Schools</h3><div class="school-grid">${(db.allocations[current.id]||[]).map(s=>`<div class="school">${s}</div>`).join('')}</div></div>`}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});document.getElementById('video').srcObject=stream}catch(e){alert('Camera permission is required to capture attendance. Please allow camera access in the browser.')}}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function trainerAttendance(){let today=new Date().toISOString().slice(0,10),a=db.attendance.find(x=>x.trainerId===current.id&&x.date===today);return `<div class="card"><div class="title"><div><h3>Daily Attendance</h3><p>${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</p></div><span class="badge ${a?'present':'pending'}">${a?'Present':'Not Marked'}</span></div>${a?`<div class="section"><p><b>Recorded:</b> ${a.time}</p><img class="photo" src="${a.photo}"><p class="muted">Attendance image captured inside the portal camera. Further capture is disabled for today.</p></div>`:`<div class="section camera"><div><video id="video" autoplay playsinline></video><div class="actions" style="margin-top:10px"><button class="secondary" onclick="startCamera()">Enable Camera</button><button class="primary" onclick="captureAttendance()">Capture & Mark Attendance</button></div></div><div><div id="preview" class="upload">Camera preview will appear on the left. Capture one image for today's attendance.</div></div></div>`}</div><div class="section card"><div class="title"><div><h3>Attendance Calendar</h3><p>Green = Present · Red = Absent</p></div><select onchange="renderTrainer('Attendance')"><option>${new Date().toLocaleString('en-IN',{month:'long',year:'numeric'})}</option></select></div>${calendar()}</div>`}
function captureAttendance(){let v=document.getElementById('video');if(!v||!v.srcObject)return alert('Enable the camera first.');attendanceCanvas.width=v.videoWidth||640;attendanceCanvas.height=v.videoHeight||400;attendanceCanvas.getContext('2d').drawImage(v,0,0,attendanceCanvas.width,attendanceCanvas.height);let photo=attendanceCanvas.toDataURL('image/jpeg',.72),today=new Date().toISOString().slice(0,10);db.attendance.push({id:'AT-'+Date.now(),trainerId:current.id,name:current.name,date:today,time:new Date().toLocaleTimeString('en-IN'),photo,status:'Pending Inspection',school:(db.allocations[current.id]||[])[0]||''});save();stopCamera();renderTrainer('Attendance')}
function calendar(){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,a=db.attendance.find(x=>x.trainerId===current.id&&x.date===ds);cells+=`<div class="day ${a?'present-day':'absent-day'}"><span class="n">${d}</span><small>${a?'PRESENT':'ABSENT'}</small></div>`}return `<div class="calendar-head"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="calendar">${cells}</div>`}
function trainerAssignments(){let as=db.assignments.filter(x=>x.assignedTo===current.id);return `<div class="section">${as.length?as.map(a=>{let closed=new Date()>new Date(a.due+'T23:59:59');return `<div class="card" style="margin-bottom:12px"><div class="title"><div><h3>${a.title}</h3><p>${a.description}</p></div><span class="badge ${a.priority==='High'?'rejected':'info'}">${a.priority}</span></div><p><b>Due:</b> ${a.due} · <b>Status:</b> ${a.status}</p>${a.file?`<p class="muted">Uploaded: ${a.file.name}</p>`:''}<div class="actions">${!closed&&a.status!=='Completed'?`<label class="secondary">Upload <input type="file" hidden onchange="uploadAssignment(${a.id},this)"></label>`:''}${closed?'<span class="badge rejected">Upload closed after due date</span>':a.file?'<span class="badge present">Upload submitted</span>':''}</div></div>`}).join(''):'<div class="card">No assignments currently.</div>'}</div>`}
function uploadAssignment(id,input){let f=input.files[0];if(!f)return;let a=db.assignments.find(x=>x.id===id);if(new Date()>new Date(a.due+'T23:59:59'))return alert('The upload window has closed.');a.file={name:f.name,type:f.type,size:f.size};a.status='Submitted';save();renderTrainer('Assignments');alert('Assignment upload recorded.')}
function trainerReports(){return `<div class="grid"><div class="card"><div class="label">Weekly Report</div><div class="muted">Submit your weekly activity report.</div><button class="primary" style="margin-top:14px" onclick="reportForm('Weekly')">Submit Weekly Report</button></div><div class="card"><div class="label">Monthly Report</div><div class="muted">Submit your monthly activity report.</div><button class="primary" style="margin-top:14px" onclick="reportForm('Monthly')">Submit Monthly Report</button></div></div><div class="section card"><h3>Submitted Reports</h3>${[...db.weekly,...db.monthly].filter(x=>x.trainerId===current.id).map(x=>`<div class="notice"><b>${x.type} Report</b><div>${x.text}</div><small>${x.date}</small></div>`).join('')||'<p class="muted">No reports submitted yet.</p>'}</div>`}
function reportForm(type){showModal(`<h2>${type} Report</h2><div class="field"><label>Report content</label><textarea id="reportText" placeholder="Activities completed, school updates, issues, next actions..."></textarea></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="submitReport('${type}')">Submit Report</button></div>`)}
function submitReport(type){let text=document.getElementById('reportText').value.trim();if(!text)return alert('Enter report content.');db[type.toLowerCase()].push({trainerId:current.id,type,text,date:new Date().toLocaleDateString('en-IN')});save();closeModal();renderTrainer('Reports')}
function trainerLeave(){return `<div class="card"><h3>Leave Application</h3><div class="field"><label>From</label><input type="date" id="lf"></div><div class="field"><label>To</label><input type="date" id="lt"></div><div class="field"><label>Reason</label><textarea id="lr"></textarea></div><button class="primary" onclick="applyLeave()">Submit Leave Application</button></div><div class="section card"><h3>My Applications</h3>${db.leaves.filter(x=>x.trainerId===current.id).map(x=>`<div class="notice"><b>${x.from} → ${x.to}</b><div>${x.reason}</div><span class="badge ${x.status==='Approved'?'approved':x.status==='Declined'?'declined':'pending'}">${x.status}</span><small> · ${x.lastActionBy||'Pending review'}</small></div>`).join('')||'<p class="muted">No applications.</p>'}</div>`}
function applyLeave(){let f=document.getElementById('lf').value,t=document.getElementById('lt').value,r=document.getElementById('lr').value.trim();if(!f||!t||!r)return alert('Complete all leave fields.');db.leaves.push({id:Date.now(),trainerId:current.id,name:current.name,from:f,to:t,reason:r,status:'Pending',history:[]});save();renderTrainer('Leave')}
function profile(){return `<div class="card"><h3>${current.name}</h3><p class="muted">${current.id} · ${current.role}</p><h3 class="section">Assigned Schools</h3><div class="school-grid">${(db.allocations[current.id]||[]).map(s=>`<div class="school">${s}</div>`).join('')}</div><h3 class="section">Security</h3><button class="secondary" onclick="alert('Demo: connect this action to the backend password service in production.')">Change Password</button></div>`}
function renderMaster(active='Overview'){document.getElementById('portal').classList.remove('hidden');let items=[['Overview',"renderMaster('Overview')"],['Trainers',"renderMaster('Trainers')"],['Schools & Allocation',"renderMaster('Schools')"],['Attendance',"renderMaster('Attendance')"],['Attendance Inspection',"renderMaster('Inspection')"],['Leave Approvals',"renderMaster('Leave')"],['Reports',"renderMaster('Reports')"],['Assignments',"renderMaster('Assignments')"],['Announcements',"renderMaster('Announcements')"],['Profile & Security',"renderMaster('Profile')"]];let c=active==='Overview'?masterOverview():active==='Trainers'?masterTrainers():active==='Schools'?masterSchools():active==='Attendance'?masterAttendance():active==='Inspection'?inspection():active==='Leave'?masterLeave():active==='Reports'?masterReports():active==='Assignments'?masterAssignments():active==='Announcements'?masterAnnouncements():masterProfile();layout('Master Management Dashboard',current.masterRole+' · Full management control',items,active,c)}
function masterOverview(){return `<div class="grid"><div class="card"><div class="label">Trainers</div><div class="metric">${trainers.length}</div></div><div class="card"><div class="label">Present Today</div><div class="metric">${db.attendance.filter(x=>x.date===new Date().toISOString().slice(0,10)).length}</div></div><div class="card"><div class="label">Pending Leave</div><div class="metric">${db.leaves.filter(x=>x.status==='Pending').length}</div></div><div class="card"><div class="label">Pending Inspection</div><div class="metric">${db.attendance.filter(x=>x.status==='Pending Inspection').length}</div></div></div>`}
function masterTrainers(){return `<div class="card"><h3>Trainer Directory</h3><table class="table"><tr><th>ID</th><th>Name</th><th>Role</th><th>City</th><th>Schools</th></tr>${trainers.map(t=>`<tr><td>${t.id}</td><td>${t.name}</td><td>${t.role}</td><td>${t.city}</td><td>${(db.allocations[t.id]||[]).join(', ')}</td></tr>`).join('')}</table></div>`}
function masterSchools(){return `<div class="grid">${schools.map(s=>`<div class="card"><h3>${s}</h3><div class="metric">${trainers.filter(t=>(db.allocations[t.id]||[]).includes(s)).length}</div><div class="muted">Allocated trainers</div><button class="secondary" style="margin-top:12px" onclick="schoolDetail('${s}')">View School Data</button></div>`).join('')}</div><div class="card"><h3>Allocate Trainer</h3><div class="field"><label>Trainer</label><select id="at"><option value="">Select</option>${trainers.map(t=>`<option value="${t.id}">${t.name} (${t.id})</option>`).join('')}</select></div><div class="field"><label>School</label><select id="as"><option value="">Select</option>${schools.map(s=>`<option>${s}</option>`).join('')}</select></div><button class="primary" onclick="allocate()">Add Allocation</button></div><div class="card" style="margin-top:12px"><h3>Adjust Allocation</h3><div class="field"><label>Trainer</label><select id="rt"><option value="">Select</option>${trainers.map(t=>`<option value="${t.id}">${t.name} (${t.id})</option>`).join('')}</select></div><div class="field"><label>School</label><select id="rs"><option value="">Select</option>${schools.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="actions"><button class="danger" onclick="removeAllocation()">Remove Trainer From School</button></div></div>`}
function allocate(){let id=document.getElementById('at').value,s=document.getElementById('as').value;if(!id||!s)return alert('Select trainer and school.');db.allocations[id]=db.allocations[id]||[];if(!db.allocations[id].includes(s))db.allocations[id].push(s);save();renderMaster('Schools')}
function removeAllocation(){let id=document.getElementById('rt').value,s=document.getElementById('rs').value;if(!id||!s)return alert('Select trainer and school.');db.allocations[id]=(db.allocations[id]||[]).filter(x=>x!==s);save();renderMaster('Schools')}
function schoolDetail(s){let ts=trainers.filter(t=>(db.allocations[t.id]||[]).includes(s));showModal(`<h2>${s}</h2><p class="muted">School-level trainer and activity view.</p><table class="table"><tr><th>Trainer</th><th>ID</th><th>Attendance This Month</th></tr>${ts.map(t=>`<tr><td>${t.name}</td><td>${t.id}</td><td>${db.attendance.filter(a=>a.trainerId===t.id&&a.date.startsWith(new Date().toISOString().slice(0,7))).length}</td></tr>`).join('')}</table><div class="actions" style="margin-top:15px"><button class="secondary" onclick="closeModal()">Close</button></div>`)}
function masterAttendance(){return `<div class="card"><h3>Monthly Attendance</h3><div class="field"><label>Trainer</label><select onchange="attendanceTrainer=this.value;renderMaster('Attendance')"><option value="">All Trainers</option>${trainers.map(t=>`<option value="${t.id}" ${window.attendanceTrainer===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div>${monthlyTable()}</div>`}
function monthlyTable(){let month=new Date().toISOString().slice(0,7),rows=(window.attendanceTrainer?trainers.filter(t=>t.id===window.attendanceTrainer):trainers);return `<table class="table"><tr><th>Trainer</th><th>Present</th><th>Absent</th><th>Working Days</th><th>Attendance %</th></tr>${rows.map(t=>{let p=db.attendance.filter(a=>a.trainerId===t.id&&a.date.startsWith(month)&&a.status!=='Denied').length;let d=new Date().getDate();let pct=Math.round(p/Math.max(d,1)*100);return `<tr><td>${t.name} (${t.id})</td><td><span class="badge present">${p}</span></td><td><span class="badge absent">${Math.max(d-p,0)}</span></td><td>${d}</td><td>${pct}%</td></tr>`}).join('')}</table>`}
function inspection(){let pending=db.attendance.filter(a=>a.status==='Pending Inspection');return `<div class="card"><h3>Attendance Image Inspection</h3><p class="muted">Review captured images. If the image is not from the lab, deny the attendance record.</p>${pending.length?pending.map(a=>`<div class="card" style="margin-top:12px"><div class="title"><div><b>${a.name} (${a.trainerId})</b><p>${a.date} · ${a.time} · School: ${a.school||'Unassigned'}</p></div><span class="badge pending">Pending Inspection</span></div><img class="photo" src="${a.photo}"><div class="actions" style="margin-top:10px"><button class="primary" onclick="inspectAttendance('${a.id}',true)">Approve Attendance</button><button class="danger" onclick="inspectAttendance('${a.id}',false)">Deny — Not From Lab</button></div></div>`).join(''):'<p class="muted">No attendance images pending inspection.</p>'}</div>`}
function inspectAttendance(id,ok){let a=db.attendance.find(x=>x.id===id);if(!a)return;a.status=ok?'Approved':'Denied';a.inspectedBy=current.id;a.inspectedAt=new Date().toISOString();save();renderMaster('Inspection')}
function masterLeave(){return `<div class="card"><h3>Leave Applications</h3>${db.leaves.length?db.leaves.map(l=>`<div class="card" style="margin-top:12px"><div class="title"><div><b>${l.name} (${l.trainerId})</b><p>${l.from} → ${l.to}</p></div><span class="badge ${l.status==='Approved'?'approved':l.status==='Declined'?'declined':'pending'}">${l.status}</span></div><p>${l.reason}</p><p class="muted">Approval history: ${(l.history||[]).map(h=>h.actor+' '+h.action).join(' → ')||'None'}</p><div class="actions"><button class="primary" onclick="leaveAction(${l.id},'Approved')">Approve / Override</button><button class="danger" onclick="leaveAction(${l.id},'Declined')">Decline / Override</button></div></div>`).join(''):'<p class="muted">No leave applications.</p>'}</div>`}
function leaveAction(id,status){let l=db.leaves.find(x=>x.id===id);if(!l)return;l.status=status;l.lastActionBy=current.id;l.history=l.history||[];l.history.push({actor:current.id,action:status});save();renderMaster('Leave')}
function masterReports(){return `<div class="grid"><div class="card"><h3>Weekly Reports</h3>${db.weekly.map(r=>`<div class="notice"><b>${r.trainerId}</b> · ${r.date}<div>${r.text}</div></div>`).join('')||'<p class="muted">No weekly reports.</p>'}</div><div class="card"><h3>Monthly Reports</h3>${db.monthly.map(r=>`<div class="notice"><b>${r.trainerId}</b> · ${r.date}<div>${r.text}</div></div>`).join('')||'<p class="muted">No monthly reports.</p>'}</div></div>`}
function masterAssignments(){return `<div class="card"><h3>Create Assignment</h3><div class="field"><label>Title</label><input id="nt"></div><div class="field"><label>Description</label><textarea id="nd"></textarea></div><div class="field"><label>Assign To</label><select id="na">${trainers.map(t=>`<option value="${t.id}">${t.name} (${t.id})</option>`).join('')}</select></div><div class="field"><label>Priority</label><select id="np"><option>Normal</option><option>High</option><option>Critical</option></select></div><div class="field"><label>Due Date</label><input id="n due" type="date"></div><button class="primary" onclick="createAssignment()">Send Assignment</button></div><div class="section card"><h3>Submitted Assignments</h3>${db.assignments.filter(a=>a.status==='Submitted').map(a=>`<div class="notice"><b>${a.title}</b> · ${a.assignedTo} · submitted<div>${a.file?.name||'Uploaded file'}</div></div>`).join('')||'<p class="muted">No submitted assignments.</p>'}</div><div class="section card"><h3>Current Assignments</h3>${db.assignments.map(a=>`<div class="notice"><b>${a.title}</b> · ${a.assignedTo} · due ${a.due}<div>${a.status}</div></div>`).join('')}</div>`}
function createAssignment(){let title=document.getElementById('nt').value.trim(),desc=document.getElementById('nd').value.trim(),to=document.getElementById('na').value,priority=document.getElementById('np').value,due=document.querySelector('[id="n due"]').value;if(!title||!due)return alert('Title and due date are required.');db.assignments.push({id:Date.now(),title,description:desc,assignedTo:to,due,priority,status:'Pending',file:null});save();renderMaster('Assignments')}
function masterAnnouncements(){return `<div class="card"><h3>Publish Announcement</h3><div class="field"><label>Title</label><input id="anT"></div><div class="field"><label>Message</label><textarea id="anM"></textarea></div><button class="primary" onclick="publishNotice()">Publish</button></div><div class="section card"><h3>Published Notices</h3>${db.notices.map(n=>`<div class="notice"><b>${n.title}</b><div>${n.text}</div><small>${n.date}</small></div>`).join('')}</div>`}
function publishNotice(){let t=document.getElementById('anT').value.trim(),m=document.getElementById('anM').value.trim();if(!t||!m)return alert('Complete notice.');db.notices.unshift({id:Date.now(),title:t,text:m,date:new Date().toLocaleDateString('en-IN')});save();renderMaster('Announcements')}
function masterProfile(){return `<div class="card"><h3>${current.name}</h3><p class="muted">${current.id} · ${current.masterRole}</p><p>All three master sections have equivalent controls. Leave decisions and attendance inspection actions are recorded with the acting account, allowing later override by another authorised master account.</p><h3 class="section">Security</h3><button class="secondary" onclick="alert('Demo: connect to backend password management in production.')">Change Password</button></div>`}
function showModal(x){document.getElementById('modalBox').innerHTML=x;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function logout(){stopCamera();current=null;document.getElementById('portal').innerHTML='';document.getElementById('portal').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');document.getElementById('topUser').textContent='';document.getElementById('loginPw').value='';}
</script></body></html>
